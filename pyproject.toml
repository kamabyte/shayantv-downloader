[project]
name = "shayantv-downloader"
version = "0.1.0"
description = "Mirror shayantv.ru cartoons into a Jellyfin-ready media library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
shayantv-dl = "shayantv_downloader.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shayantv_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
